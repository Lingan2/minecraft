<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Minecraft Clone</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
#startScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.8);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}
#startScreen h1 { font-size: 36px; margin-bottom: 20px; }
#startScreen ul { list-style: none; padding: 0; }
#startScreen button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
}
canvas { display: block; }
</style>
</head>
<body>
<div id="startScreen">
  <h1>Minecraft 3D Game</h1>
  <p>Inventory:</p>
  <ul>
    <li>Taş ×10</li>
    <li>Torpaq ×10</li>
    <li>Diamond ×5</li>
  </ul>
  <button onclick="startGame()">Oyuna Başla</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let player = {x:0, y:1.6, z:0};
let keys = {};
let blocks = [];
let blockSize = 1;

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  init();
  animate();
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(player.x, player.y, player.z);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Ground
  let geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
  let material = new THREE.MeshStandardMaterial({color:0x228B22});
  for(let x=-10;x<=10;x++){
    for(let z=-10;z<=10;z++){
      let cube = new THREE.Mesh(geometry, material);
      cube.position.set(x,0,z);
      scene.add(cube);
      blocks.push(cube);
    }
  }

  // Light
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,10,7.5);
  scene.add(light);

  // Event listeners
  document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
  document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
  window.addEventListener('resize', onWindowResize);

  // Mouse click
  document.addEventListener('mousedown', onMouseDown);
}

function onWindowResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Minimal block place/remove
function onMouseDown(event) {
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2(0,0); // center of screen
  raycaster.setFromCamera(mouse, camera);
  let intersects = raycaster.intersectObjects(blocks);
  if(intersects.length>0){
    let obj = intersects[0].object;
    if(event.button===0){ // sol klik = remove
      scene.remove(obj);
      blocks = blocks.filter(b=>b!==obj);
    } else if(event.button===2){ // sağ klik = place
      let newCube = obj.clone();
      newCube.position.y += blockSize;
      scene.add(newCube);
      blocks.push(newCube);
    }
  }
}

// Player movement
function animate() {
  requestAnimationFrame(animate);

  let speed = 0.1;
  if(keys['w']) { camera.position.z -= speed; }
  if(keys['s']) { camera.position.z += speed; }
  if(keys['a']) { camera.position.x -= speed; }
  if(keys['d']) { camera.position.x += speed; }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
