<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Minecraft 3D Demo</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
#startScreen {
  position:absolute; top:0; left:0; width:100vw; height:100vh;
  background: rgba(0,0,0,0.85); color:white;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:10;
}
#startScreen h1 { font-size:36px; margin-bottom:20px; }
#startScreen select, #startScreen button { margin-top:10px; padding:8px 12px; font-size:16px; }
#inventory {
  position:absolute; top:10px; left:10px; color:white; font-size:16px; z-index:5;
  background: rgba(0,0,0,0.5); padding:10px; border-radius:8px;
}
#crafting {
  position:absolute; bottom:10px; left:10px; color:white; font-size:16px; z-index:5;
  background: rgba(0,0,0,0.5); padding:10px; border-radius:8px;
  cursor:pointer;
}
canvas { display:block; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Mini Minecraft 3D Demo</h1>
  <p>Başlanğıc Inventory:</p>
  <ul>
    <li>Diamond Pickaxe ×1</li>
    <li>Stone ×20</li>
    <li>Diamond Block ×5</li>
  </ul>
  <p>Dünyanın ölçüsünü seçin:</p>
  <select id="worldSize">
    <option value="4">Small (4 chunk)</option>
    <option value="16" selected>Normal (16 chunk)</option>
    <option value="64">Big (64 chunk)</option>
  </select>
  <button onclick="startGame()">Oyuna Başla</button>
</div>

<div id="inventory">Inventory: Diamond Pickaxe ×1, Stone ×20, Diamond Block ×5</div>
<div id="crafting" title="Click and hold to craft">Crafting Table: Stone + Stone → Diamond Block</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
// GLOBALS
let scene, camera, renderer;
let player = {x:0, y:2, z:0, velocityY:0};
let keys = {};
let blocks = [];
let mobs = [];
let structures = [];
let ores = [];
let blockSize = 1;
let worldLimit = 20;
let gravity = -0.05;
let onGround = true;

// INVENTORY
let inventory = {diamond_pickaxe:1, stone:20, diamond_block:5};
let craftingActive = false;
let shiftPressed = false;

// START GAME
function startGame() {
  let chunkCount = parseInt(document.getElementById('worldSize').value); // 4,16,64
  let blocksPerChunk = 16;
  worldLimit = (chunkCount * blocksPerChunk)/2; // -worldLimit..worldLimit
  document.getElementById('startScreen').style.display = 'none';
  init();
  animate();
}

// INIT THREE.JS
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(player.x, player.y, player.z);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // LIGHT
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 10, 7.5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));

  // WORLD
  let geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
  let grassMat = new THREE.MeshStandardMaterial({color:0x228B22});
  let dirtMat = new THREE.MeshStandardMaterial({color:0x8B4513});
  let stoneMat = new THREE.MeshStandardMaterial({color:0x808080});
  let diamondMat = new THREE.MeshStandardMaterial({color:0x00FFFF});

  for(let x=-worldLimit;x<=worldLimit;x++){
    for(let z=-worldLimit;z<=worldLimit;z++){
      let height = Math.floor(Math.random()*3); // Random terrain height 0-2
      for(let y=0;y<=height;y++){
        let mat = (y===height)? grassMat : dirtMat;
        let cube = new THREE.Mesh(geo, mat);
        cube.position.set(x, y, z);
        scene.add(cube);
        blocks.push(cube);

        // Random stone/diamond ore below ground
        if(y<height && Math.random()<0.1){
          let stone = new THREE.Mesh(geo, stoneMat);
          stone.position.set(x, y-1, z);
          scene.add(stone);
          ores.push(stone);
        }
        if(y<height && Math.random()<0.02){
          let diamond = new THREE.Mesh(geo, diamondMat);
          diamond.position.set(x, y-1, z);
          scene.add(diamond);
          ores.push(diamond);
        }
      }
    }
  }

  // STRUCTURES & TREES
  createStructures();

  // MOBS
  createMobs();

  // EVENTS
  document.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Shift') shiftPressed=true;
  });
  document.addEventListener('keyup', e=>{
    keys[e.key.toLowerCase()]=false;
    if(e.key==='Shift') shiftPressed=false;
  });
  document.addEventListener('mousedown', onMouseDown);
  document.addEventListener('mouseup', ()=>craftingActive=false);
  window.addEventListener('resize', onWindowResize);

  // Crafting hold
  document.getElementById('crafting').addEventListener('mousedown', ()=>craftingActive=true);
  document.getElementById('crafting').addEventListener('mouseup', ()=>craftingActive=false);
}

// STRUCTURES
function createStructures(){
  let geo = new THREE.BoxGeometry(blockSize,blockSize,blockSize);
  let mat = new THREE.MeshStandardMaterial({color:0x8B4513});
  let leavesMat = new THREE.MeshStandardMaterial({color:0x00FF00});

  // Random house
  let baseX = Math.floor(Math.random()*worldLimit*0.5);
  let baseZ = Math.floor(Math.random()*worldLimit*0.5);
  for(let y=0;y<3;y++){
    for(let x=0;x<3;x++){
      for(let z=0;z<3;z++){
        let cube = new THREE.Mesh(geo, mat);
        cube.position.set(baseX+x, y+1, baseZ+z);
        scene.add(cube);
        structures.push(cube);
      }
    }
  }

  // Random tree
  let treeX = -Math.floor(Math.random()*worldLimit*0.5);
  let treeZ = -Math.floor(Math.random()*worldLimit*0.5);
  for(let y=0;y<4;y++){
    let trunk = new THREE.Mesh(geo, mat);
    trunk.position.set(treeX, y+1, treeZ);
    scene.add(trunk);
    structures.push(trunk);
  }
  for(let x=-1;x<=1;x++){
    for(let y=3;y<=5;y++){
      for(let z=-1;z<=1;z++){
        let leaf = new THREE.Mesh(geo, leavesMat);
        leaf.position.set(treeX+x, y+1, treeZ+z);
        scene.add(leaf);
        structures.push(leaf);
      }
    }
  }
}

// MOBS
function createMobs(){
  let geo = new THREE.BoxGeometry(blockSize,blockSize,blockSize);
  let mat = new THREE.MeshStandardMaterial({color:0xff0000});
  for(let i=0;i<5;i++){
    let mob = new THREE.Mesh(geo,mat);
    mob.position.set(Math.random()*worldLimit,1,Math.random()*worldLimit);
    scene.add(mob);
    mobs.push({mesh:mob,dirX:(Math.random()-0.5)*0.05, dirZ:(Math.random()-0.5)*0.05});
  }
}

// RESIZE
function onWindowResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// INVENTORY UPDATE
function updateInventoryUI(){
  document.getElementById('inventory').innerText = 
    `Inventory: Diamond Pickaxe ×${inventory.diamond_pickaxe}, Stone ×${inventory.stone}, Diamond Block ×${inventory.diamond_block}`;
}

// CRAFTING
function craftItem(){
  if(inventory.stone>=2){
    let amount = shiftPressed?Math.floor(inventory.stone/2):1;
    inventory.stone -= 2*amount;
    inventory.diamond_block += amount;
    updateInventoryUI();
  }
}

// BLOCK PLACE / REMOVE
function onMouseDown(event){
  let raycaster = new THREE.Raycaster();
  let mouse = new THREE.Vector2(0,0);
  raycaster.setFromCamera(mouse,camera);
  let intersects = raycaster.intersectObjects([...blocks,...structures,...ores,...mobs.map(m=>m.mesh)]);
  if(intersects.length>0){
    let obj = intersects[0].object;
    if(event.button===0){ // sol klik qır
      if(blocks.includes(obj)) { scene.remove(obj); blocks = blocks.filter(b=>b!==obj); }
      if(structures.includes(obj)) { scene.remove(obj); structures = structures.filter(s=>s!==obj); }
      if(ores.includes(obj)) { scene.remove(obj); ores = ores.filter(o=>o!==obj); inventory.stone+=1; updateInventoryUI(); }
      if(mobs.map(m=>m.mesh).includes(obj)) { 
        let mobObj = mobs.find(m=>m.mesh===obj);
        scene.remove(mobObj.mesh);
        mobs = mobs.filter(m=>m!==mobObj);
      }
    } else if(event.button===2){ // sağ klik qoy
      if(inventory.stone>0){
        let newCube = new THREE.Mesh(obj.geometry.clone(), obj.material.clone());
        newCube.position.y += blockSize;
        scene.add(newCube);
        blocks.push(newCube);
        inventory.stone--;
        updateInventoryUI();
      }
    }
  }
}

// ANIMATE
function animate(){
  requestAnimationFrame(animate);
  let speed = 0.1;

  // MOVE W/A/S/D
  if(keys['w']) camera.position.z -= speed;
  if(keys['s']) camera.position.z += speed;
  if(keys['a']) camera.position.x -= speed;
  if(keys['d']) camera.position.x += speed;

  // JUMP
  if(keys[' ']) { 
    if(onGround){ player.velocityY = 0.3; onGround=false; }
  }
  player.velocityY += gravity;
  camera.position.y += player.velocityY;
  if(camera.position.y<=2){camera.position.y=2; player.velocityY=0; onGround=true;}

  // MOBS MOVE
  mobs.forEach(m=>{
    m.mesh.position.x += m.dirX;
    m.mesh.position.z += m.dirZ;
    if(Math.abs(m.mesh.position.x)>worldLimit) m.dirX*=-1;
    if(Math.abs(m.mesh.position.z)>worldLimit) m.dirZ*=-1;
  });

  // Crafting hold
  if(craftingActive) craftItem();

  renderer.render(scene,camera);
}
</script>
</body>
</html>
